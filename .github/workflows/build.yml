name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck and bundle the renderer
        run: npm run build

      # The display helper is compiled at runtime, but building it here catches
      # a syntax error in the Win32 layer before anyone downloads it.
      - name: Compile the display helper
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:"$env:RUNNER_TEMP\qrdisplay.exe" native\QresDisplay.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Read the version being built
        id: meta
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Package
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: qres-win-x64
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error

      # The release is cut from package.json's version rather than from a pushed
      # tag, and action-gh-release creates the tag itself. The tag name only
      # changes when the version does, so ordinary commits refresh the current
      # release instead of piling up new ones.
      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Qres v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
